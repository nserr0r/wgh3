[package]
name = "wgh3"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.13"
boringtun = "0.7"
bytes = "1.11"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
hex = "0.4"
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.9", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
ipnet = { version = "2.12", features = ["serde"] }
libc = "0.2"
quinn = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.52", features = ["full"] }
tokio-rustls = "0.26"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2.8", features = ["async"] }
webpki-roots = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
